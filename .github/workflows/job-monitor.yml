name: Job Monitor (Pakistan) - New Postings Only

on:
  schedule:
    - cron: "0 4 * * *"   # 09:00 PKT (UTC+5)
    - cron: "0 13 * * *"  # 18:00 PKT (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }} # optional
          GEMINI_CONFIDENCE_THRESHOLD: "0.8"         # optional
          GEMINI_MAX_CANDIDATES_PER_SITE: "60"       # optional
        run: |
          python monitor_jobs.py

      - name: Commit updated state if changed
        run: |
          if git status --porcelain | grep -q "state.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update job monitor state"
            git push
          else
            echo "No state changes to commit."
          fi